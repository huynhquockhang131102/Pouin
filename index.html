<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VÉNUS - Cửa Hàng Trực Tuyến</title>
    <style>
        /* TỔNG THỂ & MÀU SẮC */
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; background-color: #ffffff; color: #333; }
        
        /* HEADER & MENU */
        header { background-color: #d97e7e; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 10px rgba(217, 126, 126, 0.2); }
        .logo { color: white; font-size: 28px; font-weight: 900; text-decoration: none; letter-spacing: 2px; }
        .menu a { color: white; text-decoration: none; margin: 0 15px; font-weight: 600; text-transform: uppercase; font-size: 14px; transition: 0.3s; }
        .menu a:hover { color: #f5e6e6; }
        
        /* CỤM NÚT HEADER (AUTH & CART) */
        .header-actions { display: flex; align-items: center; gap: 15px; }
        .btn-header { background-color: white; color: #d97e7e; border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; text-decoration: none; display: inline-block; }
        .btn-header:hover { background-color: #f5e6e6; }
        #user-greeting { color: white; font-weight: bold; display: none; }
        #cart-btn { position: relative; }
        #cart-count { position: absolute; top: -5px; right: -5px; background: #c95252; color: white; border-radius: 50%; padding: 2px 6px; font-size: 12px; min-width: 20px; text-align: center; }

        /* SẢN PHẨM */
        .section-title { text-align: center; color: #c95252; font-size: 32px; margin: 50px 0 30px 0; text-transform: uppercase; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; padding: 0 40px; max-width: 1200px; margin: 0 auto 60px auto; }
        .product-card { background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 5px 15px rgba(217, 126, 126, 0.1); transition: 0.3s; border: 2px solid #f0e0e0; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(217, 126, 126, 0.2); }
        .product-img { width: 100%; height: 250px; background-color: #f5e6e6; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; color: #d97e7e; font-size: 14px; background-size: cover; background-position: center; }
        .product-name { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 10px; }
        .product-price { color: #c95252; font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .btn-add-cart { background-color: #d97e7e; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; text-transform: uppercase; transition: 0.3s; }
        .btn-add-cart:hover { background-color: #c95252; }

        /* CART MODAL (GIỎ HÀNG) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; }
        .cart-modal { background: white; width: 90%; max-width: 600px; padding: 30px; border-radius: 15px; max-height: 80vh; overflow-y: auto; }
        .cart-modal h2 { color: #c95252; margin-top: 0; border-bottom: 2px solid #f0e0e0; padding-bottom: 10px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; }
        .cart-item-name { flex: 1; }
        .cart-item-price { margin-right: 10px; font-weight: bold; color: #c95252; }
        .btn-remove { color: #c95252; border: none; background: none; cursor: pointer; font-weight: bold; font-size: 16px; }
        .cart-empty { text-align: center; color: #888; padding: 30px 0; }
        .cart-total { text-align: right; font-size: 20px; font-weight: bold; color: #c95252; margin: 20px 0; }
        .btn-close { background: #f0e0e0; color: #333; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 10px; transition: 0.3s; }
        .btn-close:hover { background: #e8d5d5; }
        .btn-checkout { background: #c95252; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-checkout:hover { background: #d97e7e; }
        .modal-actions { text-align: right; margin-top: 20px; }

        /* THÔNG BÁO */
        .toast { display: none; position: fixed; bottom: 20px; right: 20px; background: #4CAF50; color: white; padding: 15px 25px; border-radius: 8px; font-weight: bold; z-index: 3000; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .toast.error { background: #d32f2f; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 15px; }
            .menu { display: flex; flex-direction: column; gap: 10px; }
            .products-grid { padding: 0 20px; }
            .section-title { font-size: 24px; }
        }
    </style>
</head>
<body>

    <!-- 1. HEADER -->
    <header>
        <a href="#" class="logo">VÉNUS</a>
        <nav class="menu">
            <a href="#products">Sản phẩm</a>
            <a href="#about">Về chúng tôi</a>
        </nav>
        <div class="header-actions">
            <span id="user-greeting">Xin chào, Khách</span>
            <button id="btn-logout" class="btn-header" style="display: none;" onclick="logout()">Đăng xuất</button>
            <button id="cart-btn" class="btn-header" onclick="openCart()">
                🛒 Giỏ hàng <span id="cart-count">0</span>
            </button>
            <a id="btn-register" href="register.html" class="btn-header" style="display: none;">Đăng Ký</a>
            <a id="btn-login" href="login.html" class="btn-header" style="display: none;">Đăng Nhập</a>
        </div>
    </header>

    <!-- 2. DANH SÁCH SẢN PHẨM -->
    <h2 class="section-title" id="products">Sản Phẩm Vénus Nổi Bật</h2>
    <section class="products-grid">
        <div class="product-card">
            <div class="product-img" style="background-image: url('https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=500&q=80');"></div>
            <div class="product-name">Váy Dạ Hội Vénus</div>
            <div class="product-price">1.250.000 đ</div>
            <button class="btn-add-cart" onclick="addToCart('Váy Dạ Hội Vénus', 1250000)">Thêm vào giỏ</button>
        </div>
        <div class="product-card">
            <div class="product-img" style="background-image: url('https://images.unsplash.com/photo-1584916201218-f4242ceb4809?auto=format&fit=crop&w=500&q=80');"></div>
            <div class="product-name">Túi Xách Vénus</div>
            <div class="product-price">2.450.000 đ</div>
            <button class="btn-add-cart" onclick="addToCart('Túi Xách Vénus', 2450000)">Thêm vào giỏ</button>
        </div>
        <div class="product-card">
            <div class="product-img" style="background-image: url('https://images.unsplash.com/photo-1586495777744-4413f21062fa?auto=format&fit=crop&w=500&q=80');"></div>
            <div class="product-name">Son Môi Vénus</div>
            <div class="product-price">450.000 đ</div>
            <button class="btn-add-cart" onclick="addToCart('Son Môi Vénus', 450000)">Thêm vào giỏ</button>
        </div>
    </section>

    <!-- 3. MODAL GIỎ HÀNG -->
    <div class="modal-overlay" id="cart-modal">
        <div class="cart-modal">
            <h2>🛒 Giỏ Hàng Của Bạn</h2>
            <div id="cart-items-container">
                <div class="cart-empty">Giỏ hàng của bạn đang trống.</div>
            </div>
            <div class="cart-total">Tổng tiền: <span id="cart-total-price">0</span> đ</div>
            <div class="modal-actions">
                <button class="btn-close" onclick="closeCart()">Đóng</button>
                <button class="btn-checkout" onclick="goToCheckout()">Tiến Hành Thanh Toán</button>
            </div>
        </div>
    </div>

    <!-- HỘP THOẠI THÔNG BÁO -->
    <div id="toast" class="toast">Thành công!</div>

    <!-- 4. JAVASCRIPT: BỘ NÃO CỦA TRANG WEB -->
    <script>
        // --- QUẢN LÝ DỮ LIỆU TỪ LOCAL STORAGE ---
        let users = JSON.parse(localStorage.getItem('venus_users')) || [];
        let currentUser = JSON.parse(localStorage.getItem('venus_currentUser')) || null;
        let cart = JSON.parse(localStorage.getItem('venus_cart')) || [];

        // Chạy ngay khi load trang
        updateUI();

        // --- CÁC HÀM TIỆN ÍCH ---
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('error');
            if (isError) {
                toast.classList.add('error');
            }
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        // Định dạng tiền tệ VNĐ
        function formatMoney(amount) {
            return amount.toLocaleString('vi-VN');
        }

        // Cập nhật giao diện theo trạng thái đăng nhập & giỏ hàng
        function updateUI() {
            // Cập nhật số lượng giỏ hàng
            document.getElementById('cart-count').innerText = cart.length;

            // Kiểm tra trạng thái đăng nhập
            if (currentUser) {
                document.getElementById('user-greeting').innerText = `Xin chào, ${currentUser.name}`;
                document.getElementById('user-greeting').style.display = 'inline';
                document.getElementById('btn-logout').style.display = 'inline-block';
                document.getElementById('btn-register').style.display = 'none';
                document.getElementById('btn-login').style.display = 'none';
            } else {
                document.getElementById('user-greeting').innerText = 'Xin chào, Khách';
                document.getElementById('user-greeting').style.display = 'inline';
                document.getElementById('btn-logout').style.display = 'none';
                document.getElementById('btn-register').style.display = 'inline-block';
                document.getElementById('btn-login').style.display = 'inline-block';
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('venus_currentUser');
            showToast("Đã đăng xuất thành công!");
            updateUI();
        }

        // --- LUỒNG: GIỎ HÀNG & THANH TOÁN ---
        function addToCart(name, price) {
            cart.push({ name, price });
            localStorage.setItem('venus_cart', JSON.stringify(cart));
            updateUI();
            showToast(`✓ Đã thêm ${name} vào giỏ hàng!`);

            // Tự động chuyển sang trang thanh toán sau 1.5 giây
            setTimeout(() => {
                window.location.href = 'checkout.html';
            }, 1500);
        }

        function openCart() {
            const container = document.getElementById('cart-items-container');
            container.innerHTML = ''; // Xóa dữ liệu cũ
            let total = 0;

            if(cart.length === 0) {
                container.innerHTML = '<div class="cart-empty">Giỏ hàng của bạn đang trống.</div>';
            } else {
                cart.forEach((item, index) => {
                    total += item.price;
                    container.innerHTML += `
                        <div class="cart-item">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">${formatMoney(item.price)} đ</div>
                            <button class="btn-remove" onclick="removeItem(${index})">✕</button>
                        </div>
                    `;
                });
            }

            document.getElementById('cart-total-price').innerText = formatMoney(total);
            document.getElementById('cart-modal').style.display = 'flex';
        }

        function closeCart() {
            document.getElementById('cart-modal').style.display = 'none';
        }

        function goToCheckout() {
            if (cart.length === 0) {
                showToast("Giỏ hàng trống!", true);
                return;
            }
            closeCart();
            window.location.href = 'checkout.html';
        }

        function removeItem(index) {
            const itemName = cart[index].name;
            cart.splice(index, 1);
            localStorage.setItem('venus_cart', JSON.stringify(cart));
            openCart(); // Tải lại giao diện giỏ hàng
            updateUI();
            showToast(`✓ Đã xóa ${itemName} khỏi giỏ hàng!`);
        }
    </script>
</body>
</html>
